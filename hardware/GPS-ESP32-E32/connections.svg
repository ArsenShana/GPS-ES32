<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690"><rect width="1000" height="690" fill="#fafcf7"/><g font-family="Arial, sans-serif" fill="#304837"><text x="40" y="42" font-size="22">ALANATECH GPS · СХЕМА СОЕДИНЕНИЙ R0</text><text x="40" y="68" font-size="12" fill="#84937c">ESP32-DevKitC V4 WROOM · NEO-6M breakout · E32-433T30D</text><rect x="35" y="88" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="108" font-size="12">GPS TX → ESP RX</text><text x="270" y="108" font-size="11">J4.3</text><path d="M430 104h85" stroke="#36896b" stroke-width="2"/><text x="536" y="108" font-size="11">GPIO16 / J3.12</text><text x="895" y="108" font-size="9" text-anchor="end" fill="#719168">GPS_TX</text><rect x="35" y="128" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="148" font-size="12">ESP TX → GPS RX</text><text x="270" y="148" font-size="11">GPIO17 / J3.11</text><path d="M430 144h85" stroke="#36896b" stroke-width="2"/><text x="536" y="148" font-size="11">J4.2</text><text x="895" y="148" font-size="9" text-anchor="end" fill="#719168">GPS_RX</text><rect x="35" y="168" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="188" font-size="12">E32 TXD → ESP RX</text><text x="270" y="188" font-size="11">J5.4</text><path d="M430 184h85" stroke="#36896b" stroke-width="2"/><text x="536" y="188" font-size="11">GPIO26 / J2.10</text><text x="895" y="188" font-size="9" text-anchor="end" fill="#719168">E32_TXD</text><rect x="35" y="208" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="228" font-size="12">ESP TX → E32 RXD</text><text x="270" y="228" font-size="11">GPIO27 / J2.11</text><path d="M430 224h85" stroke="#36896b" stroke-width="2"/><text x="536" y="228" font-size="11">J5.3</text><text x="895" y="228" font-size="9" text-anchor="end" fill="#719168">E32_RXD</text><rect x="35" y="248" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="268" font-size="12">Режим радио M0</text><text x="270" y="268" font-size="11">GPIO25 / J2.9</text><path d="M430 264h85" stroke="#36896b" stroke-width="2"/><text x="536" y="268" font-size="11">J5.1</text><text x="895" y="268" font-size="9" text-anchor="end" fill="#719168">E32_M0</text><rect x="35" y="288" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="308" font-size="12">Режим радио M1</text><text x="270" y="308" font-size="11">GPIO18 / J3.9</text><path d="M430 304h85" stroke="#36896b" stroke-width="2"/><text x="536" y="308" font-size="11">J5.2</text><text x="895" y="308" font-size="9" text-anchor="end" fill="#719168">E32_M1</text><rect x="35" y="328" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="348" font-size="12">Готовность AUX</text><text x="270" y="348" font-size="11">J5.5</text><path d="M430 344h85" stroke="#36896b" stroke-width="2"/><text x="536" y="348" font-size="11">GPIO19 / J3.8</text><text x="895" y="348" font-size="9" text-anchor="end" fill="#719168">E32_AUX</text><rect x="35" y="368" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="388" font-size="12">Питание GPS</text><text x="270" y="388" font-size="11">3V3 / J2.1</text><path d="M430 384h85" stroke="#36896b" stroke-width="2"/><text x="536" y="388" font-size="11">J4.1</text><text x="895" y="388" font-size="9" text-anchor="end" fill="#719168">+3V3</text><rect x="35" y="408" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="428" font-size="12">Питание E32</text><text x="270" y="428" font-size="11">J1.1 / 5V</text><path d="M430 424h85" stroke="#36896b" stroke-width="2"/><text x="536" y="428" font-size="11">J5.6, C1+, C2.1</text><text x="895" y="428" font-size="9" text-anchor="end" fill="#719168">+5V_MAIN</text><rect x="35" y="448" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="468" font-size="12">Питание ESP32</text><text x="270" y="468" font-size="11">5V → JP1 → J2.19</text><path d="M430 464h85" stroke="#36896b" stroke-width="2"/><text x="536" y="468" font-size="11">Снять JP1 при USB</text><text x="895" y="468" font-size="9" text-anchor="end" fill="#719168">+5V_ESP</text><rect x="35" y="488" width="930" height="35" rx="4" fill="#eff4e9"/><text x="48" y="508" font-size="12">Общая земля</text><text x="270" y="508" font-size="11">J1.2</text><path d="M430 504h85" stroke="#36896b" stroke-width="2"/><text x="536" y="508" font-size="11">J2.14 / J3.1,7 / GPS.4 / E32.7</text><text x="895" y="508" font-size="9" text-anchor="end" fill="#719168">GND</text><rect x="35" y="528" width="930" height="35" rx="4" fill="#fafcf7"/><text x="48" y="548" font-size="12">Индикатор TX</text><text x="270" y="548" font-size="11">GPIO2 / J3.15</text><path d="M430 544h85" stroke="#36896b" stroke-width="2"/><text x="536" y="548" font-size="11">R1 330Ω → D1 → GND</text><text x="895" y="548" font-size="9" text-anchor="end" fill="#719168">LED_GPIO</text><text x="40" y="622" font-size="12">C1: 1000 µF / 10 V, C2: 100 nF — параллельно 5V_MAIN / GND рядом с E32.</text><text x="40" y="647" font-size="12">Вход: стабилизированные 5 В / 2 А. UART: 3.3 В. Установить антенну до включения радио.</text><text x="40" y="674" font-size="11" fill="#899379">Контакты GPS и механика углового E32-разъёма требуют сверки. DRC/ERC и стендовая проверка ещё не выполнены.</text></g></svg>