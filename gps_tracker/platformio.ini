; GPS-трекер: ESP32 + NEO-6M + E32-433T30D
[platformio]
default_envs = tracker

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3

; Обычная прошивка
[env:tracker]
extends = esp32

; Тест радиоканала без GPS на столе: тестовые координаты по кругу, мощность 21 дБм
[env:tracker_fake]
extends = esp32
build_flags = -DFAKE_GPS=1 -DE32_POWER=3

; Плата-носитель Carrier R0: AUX подключён дорожкой к GPIO19.
; Сниженная мощность для первого стендового запуска, совпадает с carrier_fake.
[env:carrier]
extends = esp32
build_flags = -DE32_AUX_PIN=19 -DE32_POWER=3

[env:carrier_fake]
extends = esp32
build_flags = -DE32_AUX_PIN=19 -DE32_POWER=3 -DFAKE_GPS=1

; KiCad GPS-ESP32-E32 / routed R0 carrier pin mapping.
[env:kicad_r0]
extends = esp32
build_flags = -DGPS_RX_PIN=16 -DGPS_TX_PIN=17 -DE32_RX_PIN=26 -DE32_TX_PIN=27 -DE32_M0_PIN=25 -DE32_M1_PIN=18 -DE32_AUX_PIN=19 -DE32_POWER=3

[env:kicad_r0_fake]
extends = env:kicad_r0
build_flags = ${env:kicad_r0.build_flags} -DFAKE_GPS=1

; Юнит-тесты протокола на ПК: pio test -e native
[env:native]
platform = native
lib_ignore = E32
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE

; Стенд: настоящий GPS, мощность 21 дБм (модули рядом на столе).
; Без фикса GPS всё равно шлёт пакет каждые 5 с (fix=0) — видно, что трекер жив.
[env:bench]
extends = esp32
build_flags = -DE32_POWER=3
