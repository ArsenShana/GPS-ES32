; GPS-трекер: ESP32 + NEO-6M + E32-433T30D
[platformio]
default_envs = tracker

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3

; Обычная прошивка
[env:tracker]
extends = esp32

; Тест радиоканала без GPS на столе: тестовые координаты по кругу, мощность 21 дБм
[env:tracker_fake]
extends = esp32
build_flags = -DFAKE_GPS=1 -DE32_POWER=3

; Юнит-тесты протокола на ПК: pio test -e native
[env:native]
platform = native
lib_ignore = E32
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE
