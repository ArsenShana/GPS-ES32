; Приёмник: ESP32 + E32-433T30D + Wi-Fi веб-сервер
[platformio]
default_envs = receiver

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:receiver]
extends = esp32

; Проверка эфира в обратную сторону: приёмник шлёт PING, трекер печатает принятое.
[env:tx_test]
extends = esp32
build_flags = -DTX_TEST=1 -DE32_POWER=3

; Юнит-тесты протокола на ПК: pio test -e native
[env:native]
platform = native
lib_ignore = E32
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE
